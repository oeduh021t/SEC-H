services:
  api:
    image: node:20-alpine
    container_name: sech_backend
    restart: unless-stopped
    working_dir: /app
    tty: true
    volumes:
      - ./backend:/app
      - /app/node_modules # Evita travamento de permissão na instalação de pacotes
      - ./uploads:/app/uploads # BLINDAGEM: Isola e joga as fotos para uma pasta central externa exclusiva
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    command: sh -c "npm install && npx nodemon index.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:20-alpine
    container_name: sech_frontend
    restart: unless-stopped
    working_dir: /app
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules # Otimiza o Vite/React contra lentidão de disco
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
