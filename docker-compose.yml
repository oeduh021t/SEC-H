services:
  api:
    image: node:20-alpine
    container_name: sech_backend
    restart: unless-stopped
    working_dir: /app
    tty: true
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    # O ideal aqui seria rodar "npm start" (com um script de produção)
    command: sh -c "npm install && npx nodemon index.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:20-alpine
    container_name: sech_frontend
    restart: unless-stopped
    working_dir: /app
    tty: true
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
